services:
  app:
    build: .
    container_name: planner_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - planner

  nginx:
    image: nginx:alpine
    container_name: planner_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - planner

  db:
    image: mysql:8.0
    container_name: planner_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: burrinho_local
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - planner

networks:
  planner:

volumes:
  dbdata: