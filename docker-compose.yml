services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: planner-tecom:latest
    container_name: planner_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - planner_storage:/var/www/storage/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - planner

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        APP_IMAGE: planner-tecom:latest
    image: planner-tecom-nginx:latest
    container_name: planner_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - planner_storage:/var/www/storage/app:ro
    depends_on:
      - app
    networks:
      - planner

networks:
  planner:

volumes:
  planner_storage:
