; Supervisor — Hostinger VPS
; Instalação:
;   sudo cp deploy/supervisor/planner-reverb.conf /etc/supervisor/conf.d/
;   Edite command/user/paths abaixo
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start planner-reverb

[program:planner-reverb]
process_name=%(program_name)s
command=php /home/SEU_USUARIO/domains/SEU_DOMINIO/public_html/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/home/SEU_USUARIO/domains/SEU_DOMINIO/public_html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=SEU_USUARIO
numprocs=1
redirect_stderr=true
stdout_logfile=/home/SEU_USUARIO/logs/planner-reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
