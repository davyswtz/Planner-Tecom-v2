# Nginx — proxy WebSocket para Laravel Reverb (Hostinger VPS)
# Inclua dentro do server { } do seu domínio (CyberPanel / hPanel VPS).
#
# Reverb escuta em 127.0.0.1:8080 (Supervisor).
# O browser conecta em wss://seu-dominio.com:443 via este proxy.

location /app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 86400;
}

